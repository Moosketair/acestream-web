name: acestream-web
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: acestream-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?Set a NEW Proton key in .env}
      DNS_SERVER: "on"
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      DNS_UPSTREAM_RESOLVERS: cloudflare
      FIREWALL_INPUT_PORTS: "8080"
    ports:
      # Web interface only. Never publish ports 6878 (engine) or 8000 (VPN API).
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-8087}:8080"
    volumes:
      - ./config/gluetun-control.toml:/gluetun/auth/config.toml:ro
  acestream:
    image: jopsis/aceserve:v3.2.17
    container_name: acestream
    restart: unless-stopped
    network_mode: service:gluetun
    volumes:
      - ${ACESTREAM_DNS_FILE:-./config/resolv.conf}:/etc/resolv.conf:ro
    depends_on:
      gluetun:
        condition: service_healthy
  acestream-web:
    image: ghcr.io/moosketair/acestream-web:latest
    container_name: acestream-web
    restart: unless-stopped
    network_mode: service:gluetun
    environment:
      DATA_DIR: /data
      ACESTREAM_URL: http://127.0.0.1:6878
      GLUETUN_URL: http://127.0.0.1:8000
      SETUP_TOKEN: ${SETUP_TOKEN:?Set an unguessable setup token in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_STREAMS: ${MAX_STREAMS:-3}
    volumes:
      - acestream-data:/data
    depends_on:
      gluetun:
        condition: service_healthy
      acestream:
        condition: service_started
volumes:
  acestream-data:
